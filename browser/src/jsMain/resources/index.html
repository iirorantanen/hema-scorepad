<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HEMA Scorepad</title>
<link rel="stylesheet" href="scoreboard.css">
<script src="browser.js" defer></script>
</head>
<body>
<!-- Screen.kt fills in the scores, the bout timer, the accessible names of the halves and the bout timer, the point log
     and the settings, and puts the halves in the order of the side arrangement. -->
<main>
  <div id="halves">
    <button id="red" class="half red"><span></span></button>
    <button id="blue" class="half blue"><span></span></button>
  </div>
  <button id="timer"><span id="last-exchange" hidden>Last exchange</span><span></span></button>
  <div id="controls">
    <button id="undo" aria-label="Undo the most recent point">Undo</button>
    <button id="log" aria-label="Show the point log">Log</button>
    <button id="swap" aria-label="Swap sides">Swap</button>
    <button id="new-bout" aria-label="Start a new bout">New bout</button>
    <!-- A glyph, not the word, so five controls fit in one row. The variation selector asks for the text glyph, not an emoji. -->
    <button id="settings" aria-label="Open the settings">⚙&#xFE0E;</button>
  </div>
</main>
<dialog id="point-log" aria-labelledby="point-log-title">
  <div>
    <h1 id="point-log-title"></h1>
    <ol id="points"></ol>
    <!-- A phone without a back button, and a screen reader, need a control that closes the point log. -->
    <form method="dialog"><button aria-label="Close the point log">Close</button></form>
  </div>
</dialog>
<dialog id="new-bout-confirmation" aria-labelledby="new-bout-title">
  <div>
    <h1 id="new-bout-title">Start a new bout?</h1>
    <p>This clears the score, the point log and the bout timer.</p>
    <form method="dialog">
      <button aria-label="Keep the current bout">Cancel</button>
      <button id="confirm-new-bout" aria-label="Clear the current bout">New bout</button>
    </form>
  </div>
</dialog>
<dialog id="settings-dialog" aria-labelledby="settings-title">
  <div>
    <h1 id="settings-title">Settings</h1>
    <!-- One setting: its value, a step down, a step up, and the switch that turns it off or back on. -->
    <p><label for="bout-length-value">Bout length</label><output id="bout-length-value"></output></p>
    <div class="row">
      <button id="bout-length-down" aria-label="Lower the bout length by 30 s">−30 s</button>
      <button id="bout-length-up" aria-label="Raise the bout length by 30 s">+30 s</button>
      <button id="bout-length-switch"></button>
    </div>
    <p><label for="point-cap-value">Point cap</label><output id="point-cap-value"></output></p>
    <div class="row">
      <button id="point-cap-down" aria-label="Lower the point cap by 1">−1</button>
      <button id="point-cap-up" aria-label="Raise the point cap by 1">+1</button>
      <button id="point-cap-switch"></button>
    </div>
    <p class="note">A change during a bout applies from the next new bout.</p>
    <form method="dialog"><button aria-label="Close the settings">Close</button></form>
  </div>
</dialog>
</body>
</html>
