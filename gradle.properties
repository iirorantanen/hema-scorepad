# npm comes with Node.js, so the JS target needs no Yarn download.
kotlin.js.yarn=false
# One check leaves the Gradle daemon at about 256 MB of Metaspace, and each build script edit adds to it.
# At the default 384m daemons ran out, and Android lint failed in one that had.
# Setting jvmargs drops Gradle's default heap, so 512m restates it.
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=1g
